name: Preview · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

run-name: Preview — GitHub Pages (${{ github.sha }})

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      # Static generate for GitHub Pages (no Nitro runtime on Pages).
      # NUXT_APP_BASE_URL must match the repo Pages path.
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /rs-saas/
          NUXT_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.NUXT_PUBLIC_YANDEX_MAPS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
